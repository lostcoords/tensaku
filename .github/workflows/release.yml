name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ruby -r ./lib/tensaku/version -e 'abort "Tag does not match gem version" unless ENV.fetch("RELEASE_TAG") == "v#{Tensaku::VERSION}"'
      - run: gem build tensaku.gemspec --output tensaku.gem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tensaku-gem
          path: tensaku.gem
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tensaku-gem
      - name: Authenticate with RubyGems
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const jwt = await core.getIDToken("rubygems.org");
            const response = await fetch("https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token", {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({ jwt, owner: "242093" })
            });
            if (!response.ok) throw new Error(`RubyGems authentication failed: HTTP ${response.status}`);
            const { rubygems_api_key: key } = await response.json();
            if (!key) throw new Error("RubyGems did not return a publishing key");
            core.setSecret(key);
            core.exportVariable("GEM_HOST_API_KEY", key);
      - run: gem push tensaku.gem --host https://rubygems.org
